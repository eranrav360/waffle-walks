# Drop this file in /etc/nginx/sites-available/waffle
# then: sudo ln -s /etc/nginx/sites-available/waffle /etc/nginx/sites-enabled/
# then: sudo certbot --nginx -d waffle.raviv360.com
# then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name waffle.raviv360.com;

    # Certbot will add the HTTPS block automatically.
    # Until then, you can access http://waffle.raviv360.com

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
